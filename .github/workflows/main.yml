name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 1 -Force

          Set-Service -Name TermService -StartupType Automatic

          Restart-Service -Name TermService -Force

          Write-Host "Remote Desktop configured successfully."


      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          Write-Host "Creating RDP user..."

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = [char[]]'!@#$%^&*_-+='
          }

          $rawPassword = @()

          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {

              Set-LocalUser -Name "RDP" -Password $securePass

          } else {

              New-LocalUser `
                  -Name "RDP" `
                  -Password $securePass `
                  -AccountNeverExpires `
                  -PasswordNeverExpires
          }

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "RDP" `
              -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RDP" `
              -ErrorAction SilentlyContinue

          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "RDP user creation failed."
              exit 1
          }

          Write-Host "RDP user created successfully."


      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Installing Tailscale..."

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
              -Uri $tsUrl `
              -OutFile $installerPath

          Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
              -Wait

          Remove-Item $installerPath -Force

          Write-Host "Tailscale installation completed."


      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          Write-Host "Connecting to Tailscale..."

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          & $tailscale up `
              --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
              --hostname="gh-runner-$env:GITHUB_RUN_ID"

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 12) {

              $tsIP = & $tailscale ip -4

              if ($tsIP) {
                  break
              }

              Write-Host "Waiting for Tailscale IP..."

              Start-Sleep -Seconds 5

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected."
          Write-Host "Tailscale IP: $tsIP"


      - name: Configure RDP Firewall for Tailscale
        shell: pwsh
        run: |
          Write-Host "Configuring firewall..."

          Remove-NetFirewallRule `
              -DisplayName "RDP-Tailscale" `
              -ErrorAction SilentlyContinue

          New-NetFirewallRule `
              -DisplayName "RDP-Tailscale" `
              -Direction Inbound `
              -Action Allow `
              -Protocol TCP `
              -LocalPort 3389 `
              -RemoteAddress 100.64.0.0/10

          Write-Host "Firewall configured for Tailscale RDP."


      - name: Verify RDP Service
        shell: pwsh
        run: |
          Write-Host "Checking Remote Desktop service..."

          $service = Get-Service -Name TermService

          Write-Host "TermService status: $($service.Status)"

          if ($service.Status -ne "Running") {

              Start-Service -Name TermService

              Start-Sleep -Seconds 5
          }

          $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

          if (-not $listener) {

              Write-Error "RDP is not listening on port 3389."

              exit 1
          }

          Write-Host "RDP is listening on TCP port 3389."


      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Testing RDP..."

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389

          if (-not $testResult.TcpTestSucceeded) {

              Write-Error "TCP connection to port 3389 failed."

              exit 1
          }

          Write-Host "RDP TCP connectivity successful."


      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "             RDP ACCESS"
          Write-Host "======================================"
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "Connect using Windows Remote Desktop."
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date)] RDP Active"

              Start-Sleep -Seconds 300
          }
